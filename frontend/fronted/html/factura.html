<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas | Facturación electrónica</title>
    <meta name="description" content="Panel de facturación electrónica: productos, facturas e indicadores.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f3a33'/%3E%3Cpath d='M7 4h10v16l-2.5-1.7L12 20l-2.5-1.7L7 20z' fill='%23e8a33d'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/app.js"></script>
</head>
<body data-pagina="facturas">

    <aside class="sidebar">
        <div class="brand">
            <div class="avatar-container" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="brand-name">Mi negocio<div class="brand-sub">Facturación electrónica</div></div>
        </div>

        <nav class="menu" aria-label="Principal">
            <a href="inicio.html" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                <span>Inicio</span>
            </a>
            <a href="productos.html" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                <span>Productos</span>
            </a>
            <a href="factura.html" class="menu-item active" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
                <span>Facturas</span>
            </a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="top-bar">
            <div class="search-wrap" role="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                <label class="sr-only" for="buscador">Buscar por código o cliente</label>
                <input type="search" id="buscador" class="search-box" placeholder="Buscar por código o cliente" data-singular="factura encontrada" data-plural="facturas encontradas" aria-describedby="resultados-info">
            </div>
        </header>

                <main class="content-area">
            <div class="page-head">
                <h1>Facturas</h1>
                <p id="resumen-facturas">Cargando facturas…</p>
            </div>
            <p class="sr-only" id="resultados-info" role="status" aria-live="polite"></p>

            <section class="panel" aria-label="Listado de facturas">
                <div class="tabla-wrap">
                    <table class="tabla">
                        <thead><tr><th>Código</th><th>Cliente</th><th>Fecha</th><th class="num">Total</th><th>Estado</th></tr></thead>
                        <tbody id="tabla-facturas"></tbody>
                    </table>
                </div>
                <div class="estado" id="estado-facturas" hidden></div>
                <p class="vacio" id="sin-resultados" hidden><strong>No encontramos esa factura</strong>Busca por código o por nombre del cliente.</p>
            </section>
        </main>
    </div>

</body>
</html>
